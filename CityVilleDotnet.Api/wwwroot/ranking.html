<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking · CityVille Revived · Allow Games</title>
<link rel="icon" href="/ag/favicon.ico">
<link rel="stylesheet" href="/ag/allowgames.css?v=11">
<script src="/ag/scene.js?v=2"></script>
<style>
  body{margin:0;min-height:100vh;background:linear-gradient(180deg,#7fd0f5 0,#c8ecfb 220px,transparent 220px),url(/ag/grass.png) 0 0/128px 64px,url(/ag/grass.png) 64px 32px/128px 64px,#7ba344}
  .top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px}
  .top a img{height:46px}
  select{font-family:inherit;font-weight:600;border:3px solid #1c6e9c;border-radius:999px;padding:5px 12px;background:#fbf6e6}
  .wrap{max-width:820px;margin:0 auto;padding:0 16px 40px}
  .logo{display:block;margin:6px auto 0;width:min(85vw,380px)}
  .panel{background:#2f8fc4;border:4px solid #1c6e9c;border-radius:22px;padding:14px;margin-top:22px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
  .panel h2{margin:4px 0 12px;text-align:center;font-size:26px}
  .inner{background:#fbf6e6;border:3px solid #d9c79a;border-radius:16px;padding:16px}
  .p{display:flex;gap:12px;align-items:flex-start;background:#fff;border:3px solid #d9c79a;border-radius:14px;padding:10px 12px;margin:8px 0}
  .p .e{font-size:26px;line-height:1}
  .p b{color:#0a5f8c;font-size:18px} .p span{display:block;color:#5f7d90}
  .p a{color:#0a5f8c}
  .p>div{min-width:0;overflow-wrap:anywhere}
  .panel h2{overflow-wrap:anywhere}
  .note{color:#21445a;font-size:14px;text-align:center;margin-top:12px}
  .back{display:table;margin:24px auto 0}
  table{width:100%;border-collapse:separate;border-spacing:0 6px;table-layout:fixed}
  td,th{padding:8px 10px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  th{color:#5f7d90;font-size:14px}
  tr.r td{background:#fff;border-top:3px solid #d9c79a;border-bottom:3px solid #d9c79a}
  tr.r td:first-child{border-left:3px solid #d9c79a;border-radius:12px 0 0 12px;width:56px;font-weight:700;color:#0a5f8c}
  tr.r td:last-child{border-right:3px solid #d9c79a;border-radius:0 12px 12px 0}
  th.n,td.n{width:58px}th.x,td.x{width:96px;text-align:right}
  td.u{font-weight:600;color:#0a5f8c}
  .stats{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:14px}
  .stat{background:#fbf6e6;border:3px solid #d9c79a;border-radius:14px;padding:6px 16px;font-weight:700;color:#0a5f8c;text-align:center}
  td.u{white-space:normal;overflow-wrap:anywhere;line-height:1.2}
  @media (max-width:480px){.panel{padding:10px}.inner{padding:8px}td,th{padding:7px 5px;font-size:14px}th.x,td.x{width:58px}th.n,td.n{width:38px}tr.r td:first-child{width:38px}}
</style>
</head>
<body>
<div class="top">
  <a href="/Game"><img src="/ag/allowgames_nav.png" alt="Allow Games"></a>
  <select id="lang" aria-label="Idioma / Language">
    <option value="es">Español</option><option value="en">English</option><option value="pt">Português</option>
    <option value="fr">Français</option><option value="it">Italiano</option><option value="de">Deutsch</option>
  </select>
</div>
<div class="wrap">
  <img class="logo" src="/ag/logo_revived.png" alt="CityVille Revived">
  <div class="stats"><div class="stat"><img class="agi" src="/ag/ic/city.png" alt=""><span id="sP">…</span></div><div class="stat"><span class="ag-dot"></span><span id="sO">…</span></div></div>
  <div class="panel"><h2 class="ag-stroke" data-i="t"></h2><div class="inner">
    <table><thead><tr><th class="n">#</th><th data-i="may"></th><th class="n" data-i="lvl"></th><th class="x">XP</th></tr></thead><tbody id="rows"></tbody></table>
    <p class="note" id="empty" hidden data-i="empty"></p>
  </div></div>
  <a class="btn btn-primary back" style="padding:10px 30px;text-decoration:none" href="/Game" data-i="play"></a>
</div>
<script>
var T={es:{t:"Mejores alcaldes",may:"Alcalde",lvl:"Nivel",empty:"Todavía no hay alcaldes. ¡Sé el primero!",play:"A JUGAR",p:"alcaldes",o:"en línea"},
 en:{t:"Top mayors",may:"Mayor",lvl:"Level",empty:"No mayors yet. Be the first!",play:"PLAY",p:"mayors",o:"online"},
 pt:{t:"Melhores prefeitos",may:"Prefeito",lvl:"Nível",empty:"Ainda não há prefeitos. Seja o primeiro!",play:"JOGAR",p:"prefeitos",o:"online"},
 fr:{t:"Meilleurs maires",may:"Maire",lvl:"Niveau",empty:"Pas encore de maires. Soyez le premier !",play:"JOUER",p:"maires",o:"en ligne"},
 it:{t:"Migliori sindaci",may:"Sindaco",lvl:"Livello",empty:"Ancora nessun sindaco. Sii il primo!",play:"GIOCA",p:"sindaci",o:"online"},
 de:{t:"Beste Bürgermeister",may:"Bürgermeister",lvl:"Stufe",empty:"Noch keine Bürgermeister. Sei der Erste!",play:"SPIELEN",p:"Bürgermeister",o:"online"}};
var cur='es',S=null;
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function setLang(l){if(!T[l])l='es';cur=l;try{localStorage.setItem('lang',l)}catch(e){}document.documentElement.lang=l;document.getElementById('lang').value=l;
 document.querySelectorAll('[data-i]').forEach(function(el){el.textContent=T[l][el.getAttribute('data-i')]});stats();}
function stats(){if(!S)return;document.getElementById('sP').textContent=S.players+' '+T[cur].p;document.getElementById('sO').textContent=S.online+' '+T[cur].o;}
var s=null;try{s=localStorage.getItem('lang')}catch(e){}
setLang(s||(navigator.language||'es').slice(0,2));
document.getElementById('lang').onchange=function(){setLang(this.value)};
fetch('/api/ag/stats').then(function(r){return r.json()}).then(function(x){S=x;stats()});
fetch('/api/ag/ranking').then(function(r){return r.json()}).then(function(list){
  var m=['<img class="agi lg" src="/ag/ic/gold1.png" alt="1">','<img class="agi lg" src="/ag/ic/gold2.png" alt="2">','<img class="agi lg" src="/ag/ic/gold3.png" alt="3">'],h='';
  list.forEach(function(p,i){h+='<tr class="r"><td class="n">'+(m[i]||(i+1))+'</td><td class="u" title="'+esc(p.name)+'">'+esc(p.name)+'</td><td class="n">'+p.level+'</td><td class="x">'+Number(p.xp).toLocaleString()+'</td></tr>'});
  document.getElementById('rows').innerHTML=h;document.getElementById('empty').hidden=list.length>0;});
</script>
</body>
</html>
