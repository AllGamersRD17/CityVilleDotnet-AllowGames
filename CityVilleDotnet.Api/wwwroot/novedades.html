 ["play","chg",{es:"En celular y tablet el juego abre en el modo rápido. Si quieres misiones, vecinos y todo lo demás, toca Clásica y vuelves a la versión de siempre (y desde ahí puedes regresar al modo rápido en Ajustes).",en:"On phones and tablets the game now opens in fast mode. For quests, neighbors and everything else, tap Classic to go back to the usual version (you can come back to fast mode from Settings).",pt:"No celular e tablet o jogo abre no modo rápido. Para missões, vizinhos e todo o resto, toque em Clássica e volte para a versão de sempre (e de lá dá para voltar ao modo rápido nos Ajustes).",fr:"Sur mobile et tablette le jeu s'ouvre en mode rapide. Pour les quêtes, les voisins et tout le reste, touche Classique pour revenir à la version habituelle (tu peux revenir au mode rapide depuis Réglages).",it:"Su cellulare e tablet il gioco si apre in modalità veloce. Per missioni, vicini e tutto il resto, tocca Classica e torni alla versione di sempre (e da lì puoi tornare alla modalità veloce dalle Impostazioni).",de:"Auf Handy und Tablet startet das Spiel jetzt im Schnellmodus. Für Aufgaben, Nachbarn und alles andere tippe auf Klassisch (über die Einstellungen kommst du zurück in den Schnellmodus)."}],

{v:"0.34",d:"2026-11-20",tag:"update",
 h:{es:"Avisos en el celular, nuevo inicio de sesión e intro",en:"Phone notifications, new login and intro",pt:"Avisos no celular, novo login e intro",fr:"Notifications, nouvelle connexion et intro",it:"Notifiche, nuovo accesso e intro",de:"Benachrichtigungen, neuer Login und Intro"},
 it:[
 ["com","add",{es:"Avisos como Facebook: te llegan al celular o a la PC cuando te escriben, te mandan solicitud de amistad, te ayudan en el muro, te mandan regalos, se unen a tu equipo o te piden una franquicia. Solo cuando no estás jugando.",en:"Facebook-style notifications on your phone or PC when someone messages you, sends a friend request, helps you on the wall, sends a gift, joins your crew or asks for a franchise. Only when you're not playing.",pt:"Avisos estilo Facebook no celular ou PC quando te escrevem, mandam pedido de amizade, ajudam no mural, mandam presentes, entram na sua equipe ou pedem franquia. Só quando você não está jogando.",fr:"Notifications façon Facebook sur ton téléphone ou ton PC quand on t'écrit, t'envoie une demande d'ami, t'aide sur le mur, t'envoie un cadeau, rejoint ton équipe ou demande une franchise. Seulement quand tu ne joues pas.",it:"Notifiche come Facebook su telefono o PC quando ti scrivono, ti chiedono l'amicizia, ti aiutano in bacheca, ti mandano regali, entrano nella tua squadra o chiedono un franchising. Solo quando non stai giocando.",de:"Benachrichtigungen wie bei Facebook auf Handy oder PC, wenn dir jemand schreibt, eine Freundschaftsanfrage schickt, dir an der Pinnwand hilft, ein Geschenk schickt, deiner Crew beitritt oder ein Franchise anfragt. Nur wenn du nicht spielst."}],
 ["com","add",{es:"También te avisamos cuando tu premio diario está listo y si llevas días sin entrar. Nunca de madrugada.",en:"We also remind you when your daily reward is ready and if you've been away for days. Never at night.",pt:"Também avisamos quando seu prêmio diário está pronto e se você ficou dias sem entrar. Nunca de madrugada.",fr:"On te prévient aussi quand ton cadeau du jour est prêt et si tu n'es pas venu depuis des jours. Jamais la nuit.",it:"Ti avvisiamo anche quando il premio giornaliero è pronto e se manchi da giorni. Mai di notte.",de:"Wir erinnern dich auch an deinen Tagesbonus und wenn du tagelang weg warst. Nie nachts."}],
 ["acc","chg",{es:"Inicio de sesión nuevo estilo app de Android: campos grandes, ver contraseña, interruptor de 'Recordarme' y se ve bien con el celular acostado.",en:"New Android-style login: big fields, show password, a 'Remember me' switch, and it looks good with the phone sideways.",pt:"Novo login estilo app Android: campos grandes, ver senha, interruptor 'Lembrar-me' e fica bom com o celular deitado.",fr:"Nouvelle connexion style appli Android : grands champs, afficher le mot de passe, interrupteur « Se souvenir de moi », et ça marche à l'horizontale.",it:"Nuovo accesso stile app Android: campi grandi, mostra password, interruttore 'Ricordami' e funziona bene col telefono in orizzontale.",de:"Neuer Login im Android-App-Stil: große Felder, Passwort anzeigen, 'Angemeldet bleiben'-Schalter und gut im Querformat."}],
 ["play","add",{es:"Intro nueva de Allow Games con golpe y, después, los nombres de quienes hicieron posible el revival como agradecimiento.",en:"New Allow Games intro with a punch, followed by the names of everyone who made the revival possible, as a thank-you.",pt:"Nova intro da Allow Games com impacto e, depois, os nomes de quem tornou o revival possível, como agradecimento.",fr:"Nouvelle intro Allow Games qui claque, suivie des noms de ceux qui ont rendu le revival possible, en remerciement.",it:"Nuova intro di Allow Games d'impatto, seguita dai nomi di chi ha reso possibile il revival, come ringraziamento.",de:"Neues Allow-Games-Intro mit Wucht und danach die Namen aller, die das Revival möglich gemacht haben, als Dankeschön."}],
 ["play","add",{es:"La app de Android ahora también muestra avisos en la barra del teléfono.",en:"The Android app now shows notifications in the phone's status bar too.",pt:"O app Android agora também mostra avisos na barra do celular.",fr:"L'appli Android affiche maintenant aussi les notifications.",it:"L'app Android ora mostra anche le notifiche sul telefono.",de:"Die Android-App zeigt jetzt auch Benachrichtigungen an."}]

{v:"0.33",d:"2026-11-20",tag:"major",

 it:[
 ["play","add",{es:"En celular y tablet el juego tiene su propia interfaz táctil: monedas, billetes, energía, mercancía y XP arriba; Construir, Inventario y Editar con botones grandes; Vecinos, Misiones, Desafíos y Premio al lado. Sin scroll.",en:"On phones and tablets the game has its own touch interface: coins, cash, energy, goods and XP on top; big Build, Inventory and Edit buttons; Neighbors, Quests, Challenges and Reward on the side. No scrolling.",pt:"No celular e tablet o jogo tem sua própria interface de toque: moedas, dinheiro, energia, mercadorias e XP em cima; botões grandes de Construir, Inventário e Editar; Vizinhos, Missões, Desafios e Prêmio do lado. Sem rolagem.",fr:"Sur téléphone et tablette, le jeu a sa propre interface tactile : pièces, billets, énergie, marchandises et XP en haut ; gros boutons Construire, Inventaire et Modifier ; Voisins, Quêtes, Défis et Cadeau sur le côté. Sans défilement.",it:"Su telefono e tablet il gioco ha la sua interfaccia touch: monete, contanti, energia, merci e XP in alto; grandi pulsanti Costruisci, Inventario e Modifica; Vicini, Missioni, Sfide e Premio di lato. Senza scorrere.",de:"Auf Handy und Tablet hat das Spiel jetzt eine eigene Touch-Oberfläche: Münzen, Geld, Energie, Waren und XP oben; große Knöpfe für Bauen, Inventar und Bearbeiten; Nachbarn, Aufgaben, Challenges und Bonus an der Seite. Ohne Scrollen."}],
 ["play","add",{es:"Mover, girar, guardar y vender edificios con un toque, y un botón grande para volver a tu ciudad cuando visitas a un vecino.",en:"Move, rotate, store and sell buildings with one tap, plus a big button to go back to your city when visiting a neighbor.",pt:"Mover, girar, guardar e vender prédios com um toque, e um botão grande para voltar à sua cidade ao visitar um vizinho.",fr:"Déplacer, tourner, ranger et vendre des bâtiments d'un toucher, et un gros bouton pour rentrer chez toi pendant une visite.",it:"Sposta, ruota, riponi e vendi edifici con un tocco, e un grande pulsante per tornare alla tua città quando visiti un vicino.",de:"Gebäude mit einem Tipp bewegen, drehen, lagern und verkaufen, und ein großer Knopf zurück in deine Stadt beim Nachbarbesuch."}],

var cur="es",cat="";
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tr(o){return o[cur]||o.en||o.es}
function fdate(d){try{return new Date(d+"T12:00:00").toLocaleDateString(cur,{year:"numeric",month:"long",day:"numeric"})}catch(e){return d}}
var seen=null;try{seen=localStorage.getItem("agNewsSeen")}catch(e){}
function render(){
 var L=T[cur],h="";
 // filtros
 var f='<button data-c="" class="'+(cat?"":"on")+'">'+L.all+'</button>';
 Object.keys(C).forEach(function(k){f+='<button data-c="'+k+'" class="'+(cat===k?"on":"")+'">'+'<img class="agi" src="/ag/ic/'+C[k].i+'.png" alt="">'+esc(C[k][cur])+'</button>'});
 document.getElementById("filters").innerHTML=f;
 UPD.forEach(function(u,i){
  var items=u.it.filter(function(x){return !cat||x[0]===cat});
  if(!items.length)return;
  var isNew=i===0&&seen!==u.v;
  h+='<article class="ev'+(i>1&&!cat?" closed":"")+'"><header><div class="ver">v'+u.v+'</div><div class="hd"><h2 class="ag-stroke">'+esc(tr(u.h))+'</h2><div class="meta">'+
   (isNew?'<span class="tag t-new">'+L.nw+'</span>':"")+'<span class="tag t-'+u.tag+'">'+L[u.tag]+'</span>'+fdate(u.d)+" · "+items.length+" "+L.items+'</div></div><div class="arr">▾</div></header><div class="body">';
  if(u.x&&!cat)h+='<p class="intro">'+esc(tr(u.x))+'</p>';
  var groups={},order=[];
  items.forEach(function(x){if(!groups[x[0]]){groups[x[0]]=[];order.push(x[0])}groups[x[0]].push(x)});
  order.forEach(function(g){
   h+='<div class="sec"><h3>'+'<img class="agi" src="/ag/ic/'+C[g].i+'.png" alt="">'+esc(C[g][cur])+'</h3>';
   groups[g].forEach(function(x){h+='<div class="it"><span class="k k-'+x[1]+'">'+L[x[1]]+'</span><span>'+esc(tr(x[2]))+'</span></div>'});
   h+="</div>";
  });
  h+="</div></article>";
 });
 document.getElementById("list").innerHTML=h;
 document.getElementById("soon").innerHTML="<h3><img class=\"agi\" src=\"/ag/ic/build.png\" alt=\"\">"+L.soon+"</h3><ul>"+SOON[cur].map(function(s){return"<li>"+esc(s)+"</li>"}).join("")+"</ul>";
 document.querySelectorAll("#list header").forEach(function(el){el.onclick=function(){el.parentNode.classList.toggle("closed")}});
 document.querySelectorAll("#filters button").forEach(function(b){b.onclick=function(){cat=b.getAttribute("data-c");render()}});
}
function setLang(l){if(!T[l])l="es";cur=l;try{localStorage.setItem("lang",l)}catch(e){}document.documentElement.lang=l;document.getElementById("lang").value=l;
 document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=T[l][el.getAttribute("data-i")]});document.title=T[l].t+" · CityVille Revived · Allow Games";render();}
var s=null;try{s=localStorage.getItem("lang")}catch(e){}
setLang(s||(navigator.language||"es").slice(0,2));
document.getElementById("lang").onchange=function(){setLang(this.value)};
// ya vio la ultima version: quitar el punto rojo del menu
try{localStorage.setItem("agNewsSeen",UPD[0].v)}catch(e){}
</script>
