 ["play","add",{es:"Personajes del juego a los lados de la pantalla: se mueven, saludan, te dan consejos y sueltan monedas si les das clic.",en:"Game characters on the sides of the screen: they move, wave, give you tips and drop coins when you click them.",pt:"Personagens do jogo nas laterais da tela: se mexem, acenam, dão dicas e soltam moedas quando você clica.",fr:"Des personnages du jeu sur les côtés de l'écran : ils bougent, saluent, donnent des conseils et lâchent des pièces quand tu cliques.",it:"Personaggi del gioco ai lati dello schermo: si muovono, salutano, danno consigli e lasciano monete se li clicchi.",de:"Spielfiguren an den Bildschirmseiten: Sie bewegen sich, winken, geben Tipps und lassen Münzen fallen, wenn du sie anklickst."}],
 ["play","add",{es:"Traídos del proyecto original de besuper: estación y vías del monorriel, mejoras del muelle con sus misiones, misiones de vida nocturna y del almacén.",en:"Brought over from besuper's original project: monorail station and tracks, pier upgrades with their quests, nightlife and storage quests.",pt:"Trazidos do projeto original do besuper: estação e trilhos do monotrilho, melhorias do píer com missões, missões de vida noturna e do armazém.",fr:"Repris du projet original de besuper : gare et voies du monorail, améliorations de la jetée avec leurs quêtes, quêtes de vie nocturne et d'entrepôt.",it:"Portati dal progetto originale di besuper: stazione e binari della monorotaia, miglioramenti del molo con le missioni, missioni di vita notturna e del magazzino.",de:"Aus besupers Originalprojekt übernommen: Monorail-Bahnhof und Gleise, Pier-Ausbauten mit Quests, Nachtleben- und Lager-Quests."}],

{v:"0.18",d:"2026-11-17",tag:"update",
 h:{es:"Juego más estable y sin trabas de Facebook",en:"A more stable game, no more Facebook hangs",pt:"Jogo mais estável e sem travas do Facebook",fr:"Un jeu plus stable, fini les blocages Facebook",it:"Gioco più stabile, niente più blocchi di Facebook",de:"Stabileres Spiel, keine Facebook-Hänger mehr"},
 x:{es:"Arreglamos un error que dejaba el juego trabado al tocar botones que antes usaban Facebook, y mejoramos pantallas anchas e italiano.",en:"We fixed a bug that froze the game when pressing buttons that used to rely on Facebook, and improved wide screens and Italian.",pt:"Corrigimos um erro que travava o jogo ao tocar botões que antes usavam o Facebook, e melhoramos telas largas e o italiano.",fr:"Nous avons corrigé un bug qui bloquait le jeu sur les boutons qui utilisaient Facebook, et amélioré les écrans larges et l'italien.",it:"Abbiamo corretto un errore che bloccava il gioco premendo i pulsanti che usavano Facebook, e migliorato schermi larghi e italiano.",de:"Wir haben einen Fehler behoben, der das Spiel bei früheren Facebook-Knöpfen einfrieren ließ, und breite Bildschirme sowie Italienisch verbessert."},
 it:[
 ["fb","fix",{es:"Los botones que antes abrían Facebook (compartir, permisos, pedir ayuda, invitar) ya no dejan el juego trabado.",en:"Buttons that used to open Facebook (share, permissions, ask for help, invite) no longer freeze the game.",pt:"Botões que abriam o Facebook (compartilhar, permissões, pedir ajuda, convidar) não travam mais o jogo.",fr:"Les boutons qui ouvraient Facebook (partager, autorisations, demander de l'aide, inviter) ne bloquent plus le jeu.",it:"I pulsanti che aprivano Facebook (condividi, permessi, chiedi aiuto, invita) non bloccano più il gioco.",de:"Knöpfe, die früher Facebook öffneten (Teilen, Berechtigungen, Hilfe, Einladen), frieren das Spiel nicht mehr ein."}],
 ["srv","fix",{es:"Se subieron archivos del juego que faltaban en el servidor y daban errores al cargar.",en:"Uploaded game files that were missing on the server and caused loading errors.",pt:"Enviamos arquivos do jogo que faltavam no servidor e davam erros ao carregar.",fr:"Ajout de fichiers du jeu manquants sur le serveur qui causaient des erreurs de chargement.",it:"Caricati i file del gioco che mancavano sul server e davano errori di caricamento.",de:"Fehlende Spieldateien auf dem Server hochgeladen, die Ladefehler verursachten."}],
 ["play","fix",{es:"En pantallas muy anchas el juego ya no se estira: queda centrado y los botones responden donde deben.",en:"On very wide screens the game no longer stretches: it stays centered and buttons respond where they should.",pt:"Em telas muito largas o jogo não estica mais: fica centralizado e os botões respondem onde devem.",fr:"Sur les écrans très larges, le jeu ne s'étire plus : il reste centré et les boutons répondent au bon endroit.",it:"Sugli schermi molto larghi il gioco non si allunga più: resta centrato e i pulsanti rispondono dove devono.",de:"Auf sehr breiten Bildschirmen wird das Spiel nicht mehr gestreckt: Es bleibt zentriert und Knöpfe reagieren an der richtigen Stelle."}],

 ["play","fix",{es:"La rueda del mouse vuelve a acercar y alejar la ciudad.",en:"The mouse wheel zooms the city in and out again.",pt:"A roda do mouse volta a aproximar e afastar a cidade.",fr:"La molette de la souris zoome à nouveau sur la ville.",it:"La rotella del mouse torna a zoomare la città.",de:"Das Mausrad zoomt die Stadt wieder."}]

var cur="es",cat="";
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function tr(o){return o[cur]||o.en||o.es}
function fdate(d){try{return new Date(d+"T12:00:00").toLocaleDateString(cur,{year:"numeric",month:"long",day:"numeric"})}catch(e){return d}}
var seen=null;try{seen=localStorage.getItem("agNewsSeen")}catch(e){}
function render(){
 var L=T[cur],h="";
 // filtros
 var f='<button data-c="" class="'+(cat?"":"on")+'">'+L.all+'</button>';
 Object.keys(C).forEach(function(k){f+='<button data-c="'+k+'" class="'+(cat===k?"on":"")+'">'+'<img class="agi" src="/ag/ic/'+C[k].i+'.png" alt="">'+esc(C[k][cur])+'</button>'});
 document.getElementById("filters").innerHTML=f;
 UPD.forEach(function(u,i){
  var items=u.it.filter(function(x){return !cat||x[0]===cat});
  if(!items.length)return;
  var isNew=i===0&&seen!==u.v;
  h+='<article class="ev'+(i>1&&!cat?" closed":"")+'"><header><div class="ver">v'+u.v+'</div><div class="hd"><h2 class="ag-stroke">'+esc(tr(u.h))+'</h2><div class="meta">'+
   (isNew?'<span class="tag t-new">'+L.nw+'</span>':"")+'<span class="tag t-'+u.tag+'">'+L[u.tag]+'</span>'+fdate(u.d)+" · "+items.length+" "+L.items+'</div></div><div class="arr">▾</div></header><div class="body">';
  if(u.x&&!cat)h+='<p class="intro">'+esc(tr(u.x))+'</p>';
  var groups={},order=[];
  items.forEach(function(x){if(!groups[x[0]]){groups[x[0]]=[];order.push(x[0])}groups[x[0]].push(x)});
  order.forEach(function(g){
   h+='<div class="sec"><h3>'+'<img class="agi" src="/ag/ic/'+C[g].i+'.png" alt="">'+esc(C[g][cur])+'</h3>';
   groups[g].forEach(function(x){h+='<div class="it"><span class="k k-'+x[1]+'">'+L[x[1]]+'</span><span>'+esc(tr(x[2]))+'</span></div>'});
   h+="</div>";
  });
  h+="</div></article>";
 });
 document.getElementById("list").innerHTML=h;
 document.getElementById("soon").innerHTML="<h3><img class=\"agi\" src=\"/ag/ic/build.png\" alt=\"\">"+L.soon+"</h3><ul>"+SOON[cur].map(function(s){return"<li>"+esc(s)+"</li>"}).join("")+"</ul>";
 document.querySelectorAll("#list header").forEach(function(el){el.onclick=function(){el.parentNode.classList.toggle("closed")}});
 document.querySelectorAll("#filters button").forEach(function(b){b.onclick=function(){cat=b.getAttribute("data-c");render()}});
}
function setLang(l){if(!T[l])l="es";cur=l;try{localStorage.setItem("lang",l)}catch(e){}document.documentElement.lang=l;document.getElementById("lang").value=l;
 document.querySelectorAll("[data-i]").forEach(function(el){el.textContent=T[l][el.getAttribute("data-i")]});document.title=T[l].t+" · CityVille Revived · Allow Games";render();}
var s=null;try{s=localStorage.getItem("lang")}catch(e){}
setLang(s||(navigator.language||"es").slice(0,2));
document.getElementById("lang").onchange=function(){setLang(this.value)};
// ya vio la ultima version: quitar el punto rojo del menu
try{localStorage.setItem("agNewsSeen",UPD[0].v)}catch(e){}
</script>
